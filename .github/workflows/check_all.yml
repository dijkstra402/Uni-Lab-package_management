name: Check All Device Packages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Miniforge (with mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          python-version: '3.11.14'
          channels: conda-forge,robostack-staging,uni-lab,defaults
          channel-priority: flexible
          activate-environment: unilab
          auto-update-conda: false
      - name: Install unilabos
        shell: bash -el {0}
        run: |
          mamba install -n unilab uni-lab::unilabos -c uni-lab -c robostack-staging -c conda-forge -y
      - name: Validate every package
        shell: bash -el {0}
        run: |
          set -e
          for d in packages/*/ ; do
            name=$(basename "$d")
            echo "==== $name ===="
            ( cd "$d" && unilab --check_mode --devices "./$name" --external_devices_only )
          done
