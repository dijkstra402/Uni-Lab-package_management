[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilab_device_templates"
version = "0.1.0"
description = "Uni-Lab-OS 设备大类标准模板集 (device class templates)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = [
    "unilabos",
]

[tool.setuptools.packages.find]
include = ["unilab_device_templates*"]
