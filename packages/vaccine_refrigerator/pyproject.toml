[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaccine_refrigerator"
version = "0.1.0"
description = "Uni-Lab-OS 疫苗柜标准设备类模板 (vaccine_refrigerator device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["vaccine_refrigerator*"]
