[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tissue_grinder"
version = "0.1.0"
description = "Uni-Lab-OS 组织研磨仪标准设备类模板 (tissue_grinder device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["tissue_grinder*"]
