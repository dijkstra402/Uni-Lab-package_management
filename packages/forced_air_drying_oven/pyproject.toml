[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forced_air_drying_oven"
version = "0.1.0"
description = "Uni-Lab-OS 电热鼓风干燥箱标准设备类模板 (forced_air_drying_oven device class template)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["unilabos>=0.11.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["forced_air_drying_oven*"]
