[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plate_peeler"
version = "0.1.0"
description = "Uni-Lab-OS 撕膜仪标准设备类模板 (plate_peeler device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["plate_peeler*"]
