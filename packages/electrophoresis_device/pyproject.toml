[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrophoresis_device"
version = "0.1.0"
description = "Uni-Lab-OS 电泳仪标准设备类模板 (electrophoresis_device device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["electrophoresis_device*"]
