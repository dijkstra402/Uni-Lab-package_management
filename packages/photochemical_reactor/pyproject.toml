[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photochemical_reactor"
version = "0.1.0"
description = "Uni-Lab-OS 光化学反应器标准设备类模板 (photochemical_reactor device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["photochemical_reactor*"]
