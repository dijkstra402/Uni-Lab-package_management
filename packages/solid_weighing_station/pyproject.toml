[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solid_weighing_station"
version = "0.1.0"
description = "Uni-Lab-OS 固体称量工作站标准设备类模板 (solid_weighing_station device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["solid_weighing_station*"]
