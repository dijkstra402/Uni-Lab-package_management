[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotary_evaporator"
version = "0.1.0"
description = "Uni-Lab-OS 旋转蒸发器标准设备类模板 (rotary_evaporator device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["rotary_evaporator*"]
