[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpc_cleanup_system"
version = "0.1.0"
description = "Uni-Lab-OS 凝胶渗透净化系统标准设备类模板 (gpc_cleanup_system device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["gpc_cleanup_system*"]
