[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refrigerated_centrifuge"
version = "0.1.0"
description = "Uni-Lab-OS 低温或冷冻离心机标准设备类模板 (refrigerated_centrifuge device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["refrigerated_centrifuge*"]
