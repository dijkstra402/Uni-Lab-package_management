[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thin_film_cell_assembly_station"
version = "0.1.0"
description = "Uni-Lab-OS 薄膜电池组装工站标准设备类模板 (thin_film_cell_assembly_station device class template)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["unilabos>=0.11.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["thin_film_cell_assembly_station*"]
