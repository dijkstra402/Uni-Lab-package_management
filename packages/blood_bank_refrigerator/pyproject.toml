[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blood_bank_refrigerator"
version = "0.1.0"
description = "Uni-Lab-OS 血液柜标准设备类模板 (blood_bank_refrigerator device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["blood_bank_refrigerator*"]
