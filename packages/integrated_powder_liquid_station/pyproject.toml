[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "integrated_powder_liquid_station"
version = "0.1.0"
description = "Uni-Lab-OS 一体化配粉配液站标准设备类模板 (integrated_powder_liquid_station device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["integrated_powder_liquid_station*"]
