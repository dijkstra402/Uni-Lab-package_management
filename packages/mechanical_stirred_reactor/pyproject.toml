[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanical_stirred_reactor"
version = "0.1.0"
description = "Uni-Lab-OS 机械搅拌反应釜标准设备类模板 (mechanical_stirred_reactor device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["mechanical_stirred_reactor*"]
