[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transparent_window_thermostatic_bath"
version = "0.1.0"
description = "Uni-Lab-OS 透明视窗恒温槽标准设备类模板 (transparent_window_thermostatic_bath device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["transparent_window_thermostatic_bath*"]
