[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vacuum_centrifugal_concentrator"
version = "0.1.0"
description = "Uni-Lab-OS 真空离心浓缩仪标准设备类模板 (vacuum_centrifugal_concentrator device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["vacuum_centrifugal_concentrator*"]
