[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvd_system"
version = "0.1.0"
description = "Uni-Lab-OS 化学气相沉积设备标准设备类模板 (cvd_system device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["cvd_system*"]
