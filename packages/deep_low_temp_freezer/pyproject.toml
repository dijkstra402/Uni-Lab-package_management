[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep_low_temp_freezer"
version = "0.1.0"
description = "Uni-Lab-OS 深低温冰箱标准设备类模板 (deep_low_temp_freezer device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["deep_low_temp_freezer*"]
