[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preparative_chromatograph"
version = "0.1.0"
description = "Uni-Lab-OS 制备色谱仪标准设备类模板 (preparative_chromatograph device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["preparative_chromatograph*"]
