[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbody_radiation_source"
version = "0.1.0"
description = "Uni-Lab-OS 黑体辐射源标准设备类模板 (blackbody_radiation_source device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["blackbody_radiation_source*"]
