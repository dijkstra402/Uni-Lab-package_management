[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spray_precipitation_unit"
version = "0.1.0"
description = "Uni-Lab-OS 喷雾沉淀装置标准设备类模板 (spray_precipitation_unit device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["spray_precipitation_unit*"]
