[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultra_low_temp_freezer"
version = "0.1.0"
description = "Uni-Lab-OS 超低温冰箱标准设备类模板 (ultra_low_temp_freezer device class template)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["unilabos>=0.11.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["ultra_low_temp_freezer*"]
