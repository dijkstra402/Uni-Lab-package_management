[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grinding_polishing_machine"
version = "0.1.0"
description = "Uni-Lab-OS 磨抛机标准设备类模板 (grinding_polishing_machine device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["grinding_polishing_machine*"]
