[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibratory_solid_feeder"
version = "0.1.0"
description = "Uni-Lab-OS 振动固体加料模块标准设备类模板 (vibratory_solid_feeder device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["vibratory_solid_feeder*"]
