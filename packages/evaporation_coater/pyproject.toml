[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evaporation_coater"
version = "0.1.0"
description = "Uni-Lab-OS 蒸镀仪标准设备类模板 (evaporation_coater device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["evaporation_coater*"]
