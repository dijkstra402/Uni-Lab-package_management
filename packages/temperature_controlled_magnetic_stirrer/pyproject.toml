[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temperature_controlled_magnetic_stirrer"
version = "0.1.0"
description = "Uni-Lab-OS 控温磁力搅拌器标准设备类模板 (temperature_controlled_magnetic_stirrer device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["temperature_controlled_magnetic_stirrer*"]
