[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overhead_loss_in_weight_feeder"
version = "0.1.0"
description = "Uni-Lab-OS 顶置失重固体投料模块标准设备类模板 (overhead_loss_in_weight_feeder device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["overhead_loss_in_weight_feeder*"]
