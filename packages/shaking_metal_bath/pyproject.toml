[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shaking_metal_bath"
version = "0.1.0"
description = "Uni-Lab-OS 振荡金属浴标准设备类模板 (shaking_metal_bath device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["shaking_metal_bath*"]
