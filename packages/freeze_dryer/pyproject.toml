[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freeze_dryer"
version = "0.1.0"
description = "Uni-Lab-OS 冷冻干燥机标准设备类模板 (freeze_dryer device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["freeze_dryer*"]
