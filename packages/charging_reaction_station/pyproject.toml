[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charging_reaction_station"
version = "0.1.0"
description = "Uni-Lab-OS 投料反应站标准设备类模板 (charging_reaction_station device class template)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["unilabos"]

[tool.setuptools.packages.find]
include = ["charging_reaction_station*"]
