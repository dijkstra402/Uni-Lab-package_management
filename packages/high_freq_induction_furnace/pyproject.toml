[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "high_freq_induction_furnace"
version = "0.1.0"
description = "Uni-Lab-OS 高频感应炉标准设备类模板 (high_freq_induction_furnace device class template)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["unilabos>=0.11.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["high_freq_induction_furnace*"]
